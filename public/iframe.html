<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Google Pay iframe test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        padding: 12px 16px;
        border-bottom: 1px solid #e6e6e6;
      }

      iframe {
        display: block;
        width: 100%;
        height: calc(100vh - 49px);
        border: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Iframe wrapper:</strong> Google Pay checkout flow
    </header>

    <iframe
      src="/google.html"
      title="Google Pay checkout"
      allow="payment *"
      sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-top-navigation allow-top-navigation-by-user-activation"
    ></iframe>
  </body>
</html>
