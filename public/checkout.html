<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Accept a Klarna subscription</title>
    <meta name="description" content="A demo of a payment on Stripe" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="checkout.css" />
    <script src="https://js.stripe.com/dahlia/stripe.js"></script>
    <script src="checkout.js" defer></script>
  </head>
  <body>
    <!-- Display a payment form -->
    <div>
      <strong>Checkout Session ID:</strong>
      <code id="checkout-session-id">Creating session…</code>
    </div>

    <form id="payment-form">
      <h4>Payment</h4>
      <div id="payment-element">
        <!--Stripe.js injects the Payment Element-->
      </div>

      <div id="google-pay-postal-code-container" class="hidden">
        <h4>Wallet billing ZIP code</h4>
        <input id="google-pay-postal-code" name="google-pay-postal-code" autocomplete="postal-code" inputmode="numeric" placeholder="ZIP code" value="10001" />
        <div id="google-pay-postal-code-errors" role="alert"></div>
      </div>

      <button id="submit">
        <div class="spinner hidden" id="spinner"></div>
        <span id="button-text">Subscribe now</span>
      </button>
      <div id="payment-message" class="hidden"></div>
      <h4>Debug</h4>
      <pre id="debug-info">No session created yet.</pre>
    </form>
  </body>
</html>
