<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Accept an Apple Pay subscription</title>
    <meta name="description" content="A demo of Apple Pay with Stripe" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="checkout.css" />
    <script src="https://js.stripe.com/dahlia/stripe.js"></script>
    <script src="apple.js" defer></script>
  </head>
  <body>
    <div>
      <strong>Checkout Session ID:</strong>
      <code id="checkout-session-id">Creating session…</code>
    </div>

    <form id="payment-form">
      <h4>Contact details</h4>
      <div id="contact-details-element">
        <!--Stripe.js injects the Contact Details Element-->
      </div>

      <h4>Apple Pay</h4>
      <div id="payment-element">
        <!--Stripe.js injects the Payment Element-->
      </div>

      <h4>Billing address</h4>
      <div id="billing-address-element">
        <!--Stripe.js injects the Billing Address Element-->
      </div>

      <button id="submit">
        <div class="spinner hidden" id="spinner"></div>
        <span id="button-text">Subscribe now</span>
      </button>
      <div id="payment-message" class="hidden"></div>
      <h4>Debug</h4>
      <pre id="debug-info">No session created yet.</pre>
    </form>
  </body>
</html>
